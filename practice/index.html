<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>我的名片卡</title>
  <style>
    /* 下节课学 CSS；这里先给盒子描边，让「盒子结构」现形 */
    section, div {
      border: 2px dashed #2c7a5f;
      padding: 12px;
      margin: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <!-- 最外层大盒子：整张卡片 -->
  <section>
    <h1>你好，我是小明</h1>
    <p>我在学 Vue3，想把 Pixso 稿子变成网页。</p>

    <!-- 子盒子：我的爱好 -->
    <div>
      <h2>我的爱好</h2>
      <ul>
        <li>设计</li>
        <li>前端</li>
      </ul>
    </div>

    <!-- 练习：在下面新增一个 <div> 盒子，写一句你自己的话 -->
  </section>
</body>
</html>
